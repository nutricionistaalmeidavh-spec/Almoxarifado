name: QA Real Screenshots Fixed

on:
  push:
    branches:
      - qa/real-screenshots-fixed
    paths:
      - '.qa-screenshot-fixed-trigger'

permissions:
  contents: read

jobs:
  capture:
    name: Capturar interface real corrigida
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Criar lock deterministico
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts
      - name: Instalar dependencias
        shell: pwsh
        run: npm ci
      - name: Instalar Chromium Playwright
        shell: pwsh
        run: npx playwright install chromium
      - name: Capturar prints reais corrigidos
        shell: pwsh
        run: node scripts/capture-real-screenshots.mjs
      - name: Publicar prints
        uses: actions/upload-artifact@v4
        with:
          name: almoxarifado-real-screenshots-fixed
          if-no-files-found: error
          retention-days: 7
          path: artifacts/real-screenshots/*.png
