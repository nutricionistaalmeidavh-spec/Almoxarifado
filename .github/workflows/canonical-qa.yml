name: Canonical Stock and UX QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify all tests and JS syntax
        run: npm run check
      - name: QA validation
        run: npm run qa:validate
      - name: Security scan
        run: npm run security
      - name: Verify offline ECharts asset
        run: test -s apps/web/vendor/echarts.min.js

  browser-e2e:
    name: Chromium E2E — compras e estoque reais
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências locais
        run: npm install --no-audit --no-fund
      - name: Instalar navegador Playwright
        run: npx playwright install --with-deps chromium
      - name: Fluxos completos com navegador real, API e SQLite isolados
        run: node scripts/e2e-purchases.mjs
      - name: Anexar screenshots das execuções
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-e2e-compras
          path: qa-artifacts/compras/*.png
          if-no-files-found: ignore
          retention-days: 14
